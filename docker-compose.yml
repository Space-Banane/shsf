services:
 backend:
  image: registry.reversed.dev/shsf/core:latest
  pull_policy: always
  restart: always
  env_file:
   - .env
  ports:
   - "${PORT:-5000}:${PORT:-5000}"
  environment:
   - NODE_ENV=production
   - TZ=Europe/Berlin
  volumes:
   - /var/run/docker.sock:/var/run/docker.sock
   - ./shsf_data:/opt/shsf_data

