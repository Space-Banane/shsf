services:
 backend:
  # `prod` follows the main branch. For a fully immutable deployment set SHSF_IMAGE to a
  # `sha-<commit>` tag. The in-app updater tracks this reference and, after an update,
  # pins the running service to the new image ID (see "Updating" in the README).
  image: ${SHSF_IMAGE:-registry.reversed.dev/shsf/core:prod}
  pull_policy: missing
  restart: always
  env_file:
   - .env
  ports:
   - "${PORT:-5000}:${PORT:-5000}"
  environment:
   - NODE_ENV=production
   - TZ=Europe/Berlin
  depends_on:
   db:
    condition: service_healthy
    required: false # only applies when the db profile is enabled
  volumes:
   - /var/run/docker.sock:/var/run/docker.sock
   - /opt/shsf_data:/opt/shsf_data

 # Bundled database, used when started with `docker compose --profile db up -d`.
 # The default DATABASE_URL in example.env already points at host 'db'.
 # With an external database, leave the profile off and set DATABASE_URL.
 db:
  image: mariadb:11.8
  profiles: ["db"]
  restart: always
  environment:
   MARIADB_ROOT_PASSWORD: example
   MARIADB_DATABASE: shsf
   MARIADB_USER: user
   MARIADB_PASSWORD: password
  volumes:
   - ./db:/var/lib/mysql
  healthcheck:
   test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
   interval: 5s
   timeout: 5s
   retries: 20
   start_period: 10s
