services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: shsf:dev
    pull_policy: build
    restart: always
    env_file:
      - .env
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    environment:
      NODE_ENV: development
      TZ: Europe/Berlin
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/shsf_data:/opt/shsf_data

  db:
    image: mariadb:11.8
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: example
      MARIADB_DATABASE: shsf
      MARIADB_USER: user
      MARIADB_PASSWORD: password
    volumes:
      - shsf_dev_db:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  shsf_dev_db:
